<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account</title><link rel="stylesheet" href="/portal/portal.css"></head>
<body><div class="box">
<h1>My Internet Account</h1><div class="muted">Check your expiry and renew with M-Pesa</div>
<input id="acc" placeholder="Account number, username or phone" style="margin-top:16px"><button id="go">Check</button>
<div id="info"></div><div id="msg"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const msg = (t, c = 'info') => $('#msg').innerHTML = `<div class="msg ${c}">${t}</div>`;
async function post(u, b) { const r = await fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) }); const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; }
async function check() {
  $('#msg').innerHTML = '';
  try {
    const a = await post('/api/portal/account', { account: $('#acc').value });
    $('#info').innerHTML = `<h2>${a.name}</h2><div class="kv"><div>Account</div><div>${a.accountNo}</div><div>Package</div><div>${a.packageName}</div><div>Status</div><div><b>${a.status}</b></div><div>Expires</div><div>${new Date(a.expiresAt).toLocaleString()}</div><div>Balance</div><div>${a.currency} ${a.balance}</div><div>Paybill</div><div>${a.paybill} acc ${a.accountNo}</div></div>${a.payments.length ? '<h2>Recent payments</h2>' + a.payments.map(p => `<div class="muted">${new Date(p.date).toLocaleDateString()} &middot; ${a.currency} ${p.amount} &middot; ${p.reference}</div>`).join('') : ''}
      <input id="phone" value="${a.phone || ''}" placeholder="M-Pesa phone"><input id="amt" type="number" value="${a.price}"><button id="pay">Pay ${a.currency} via M-Pesa</button>`;
    $('#pay').onclick = async () => {
      $('#pay').disabled = true;
      try {
        let t = await post('/api/portal/account/pay', { account: a.accountNo, phone: $('#phone').value, amount: $('#amt').value });
        msg('<b>Check your phone</b> and enter your M-Pesa PIN.<br>' + t.message + '<div class="spin"></div>');
        for (let i = 0; i < 70 && t.status === 'pending'; i++) { await new Promise(r => setTimeout(r, 3000)); t = await (await fetch('/api/portal/txn/' + t.id)).json(); }
        msg(t.message, t.status === 'success' ? 'ok' : 'bad');
        if (t.status === 'success') setTimeout(check, 2500); else $('#pay').disabled = false;
      } catch (e) { msg(e.message, 'bad'); $('#pay').disabled = false; }
    };
  } catch (e) { $('#info').innerHTML = ''; msg(e.message, 'bad'); }
}
$('#go').onclick = check; $('#acc').onkeydown = e => { if (e.key === 'Enter') check(); };
</script></body></html>
